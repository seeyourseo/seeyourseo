[package]
name = "site-analyzer"
version = "0.1.0"
edition = "2024"
description = "Standalone in-memory SEO and internal-link analysis API"
license = "MIT"

[dependencies]
axum = "0.8"
jieba-rs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

