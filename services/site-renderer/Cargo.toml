[package]
name = "site-renderer"
version = "0.1.0"
edition = "2024"
description = "Headless Chromium fallback renderer for site audit"
license = "MIT"

[dependencies]
axum = "0.8"
chromiumoxide = "0.9.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
